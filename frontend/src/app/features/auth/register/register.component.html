<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card card-crm border-0 shadow-lg p-4 p-md-5">
        <div class="text-center mb-4">
          <div class="avatar-icon bg-success text-white rounded-circle d-inline-flex align-items-center justify-content-center mb-3" style="width: 64px; height: 64px;">
            <i class="bi bi-person-plus-fill fs-2"></i>
          </div>
          <h2 class="fw-bold text-dark mb-1">Créer un compte Agent</h2>
          <p class="text-muted small">Inscrivez-vous pour accéder au module CRM de gestion des tickets</p>
        </div>

        <!-- Alert Error Message -->
        <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show d-flex align-items-center gap-2" role="alert">
          <i class="bi bi-exclamation-triangle-fill flex-shrink-0"></i>
          <div>{{ errorMessage }}</div>
        </div>

        <form (ngSubmit)="onSubmit()" #registerForm="ngForm" novalidate>
          <div class="row g-3">
            <!-- Nom -->
            <div class="col-md-6">
              <label for="nom" class="form-label fw-semibold">Nom <span class="text-danger">*</span></label>
              <input
                type="text"
                id="nom"
                name="nom"
                class="form-control"
                placeholder="Ex: Ben Ali"
                [(ngModel)]="registerData.nom"
                required
                #nomField="ngModel"
                [ngClass]="{ 'is-invalid': nomField.invalid && (nomField.dirty || nomField.touched) }"
              />
              <div *ngIf="nomField.invalid && (nomField.dirty || nomField.touched)" class="invalid-feedback">
                Le nom est requis.
              </div>
            </div>

            <!-- Prénom -->
            <div class="col-md-6">
              <label for="prenom" class="form-label fw-semibold">Prénom <span class="text-danger">*</span></label>
              <input
                type="text"
                id="prenom"
                name="prenom"
                class="form-control"
                placeholder="Ex: Ahmed"
                [(ngModel)]="registerData.prenom"
                required
                #prenomField="ngModel"
                [ngClass]="{ 'is-invalid': prenomField.invalid && (prenomField.dirty || prenomField.touched) }"
              />
              <div *ngIf="prenomField.invalid && (prenomField.dirty || prenomField.touched)" class="invalid-feedback">
                Le prénom est requis.
              </div>
            </div>

            <!-- Email -->
            <div class="col-12">
              <label for="email" class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
              <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                placeholder="exemple@crm.tn"
                [(ngModel)]="registerData.email"
                required
                email
                #emailField="ngModel"
                [ngClass]="{ 'is-invalid': emailField.invalid && (emailField.dirty || emailField.touched) }"
              />
              <div *ngIf="emailField.invalid && (emailField.dirty || emailField.touched)" class="invalid-feedback">
                Email valide requis.
              </div>
            </div>

            <!-- Login -->
            <div class="col-md-6">
              <label for="login" class="form-label fw-semibold">Identifiant (Login) <span class="text-danger">*</span></label>
              <input
                type="text"
                id="login"
                name="login"
                class="form-control"
                placeholder="Ex: ahmed"
                [(ngModel)]="registerData.login"
                required
                minlength="3"
                #loginField="ngModel"
                [ngClass]="{ 'is-invalid': loginField.invalid && (loginField.dirty || loginField.touched) }"
              />
              <div *ngIf="loginField.invalid && (loginField.dirty || loginField.touched)" class="invalid-feedback">
                Min. 3 caractères requis.
              </div>
            </div>

            <!-- Téléphone -->
            <div class="col-md-6">
              <label for="telephone" class="form-label fw-semibold">Téléphone <span class="text-danger">*</span></label>
              <input
                type="tel"
                id="telephone"
                name="telephone"
                class="form-control"
                placeholder="+216 20 123 456"
                [(ngModel)]="registerData.telephone"
                required
                #telField="ngModel"
                [ngClass]="{ 'is-invalid': telField.invalid && (telField.dirty || telField.touched) }"
              />
              <div *ngIf="telField.invalid && (telField.dirty || telField.touched)" class="invalid-feedback">
                Téléphone requis.
              </div>
            </div>

            <!-- Mot de passe masqué -->
            <div class="col-12">
              <label for="regPassword" class="form-label fw-semibold">Mot de passe <span class="text-danger">*</span></label>
              <div class="input-group">
                <input
                  [type]="showPassword ? 'text' : 'password'"
                  id="regPassword"
                  name="password"
                  class="form-control"
                  placeholder="Min. 6 caractères"
                  [(ngModel)]="registerData.password"
                  required
                  minlength="6"
                  #passField="ngModel"
                  [ngClass]="{ 'is-invalid': passField.invalid && (passField.dirty || passField.touched) }"
                />
                <button
                  type="button"
                  class="btn btn-outline-secondary"
                  (click)="togglePasswordVisibility()"
                >
                  <i class="bi" [ngClass]="showPassword ? 'bi-eye-slash' : 'bi-eye'"></i>
                </button>
              </div>
              <div *ngIf="passField.invalid && (passField.dirty || passField.touched)" class="invalid-feedback d-block">
                Min. 6 caractères requis.
              </div>
            </div>
          </div>

          <!-- Submit Button -->
          <div class="mt-4">
            <button
              type="submit"
              class="btn btn-success w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2"
              [disabled]="isLoading || registerForm.invalid"
            >
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm" role="status" aria-hidden="true"></span>
              <i *ngIf="!isLoading" class="bi bi-check-circle"></i>
              <span>{{ isLoading ? 'Inscription en cours...' : "S'inscrire" }}</span>
            </button>
          </div>
        </form>

        <div class="text-center mt-4 pt-3 border-top">
          <span class="text-muted small">Vous possédez déjà un compte ? </span>
          <a routerLink="/login" class="fw-semibold text-decoration-none">Se connecter</a>
        </div>
      </div>
    </div>
  </div>
</div>
